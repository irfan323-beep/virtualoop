<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual OOP Lab – SMA Negeri 37 Maluku Tengah</title>
<style>
:root{--bg:#0a1020;--p:#12203d;--g:rgba(255,255,255,.07);--b:rgba(120,200,255,.25);--t:#e8f1ff;--m:#93a7c7;--c:#38e1ff;--v:#8b7bff;--ok:#3ee08f;--er:#ff6b7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--t);font:16px/1.55 system-ui,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(900px 500px at 80% -10%,#26307a55,transparent),radial-gradient(700px 400px at -10% 110%,#0b6c8a44,transparent),var(--bg)}
#app{display:flex;min-height:100vh}
nav{width:240px;flex:none;background:#0b1530ee;border-right:1px solid var(--b);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:15px;margin:4px 8px 10px;color:var(--c)}
nav button{display:flex;width:100%;gap:8px;align-items:center;text-align:left;background:none;border:1px solid transparent;color:var(--t);padding:9px 10px;border-radius:10px;margin:3px 0;cursor:pointer;font-size:14px}
nav button small{display:block;font-size:10px;color:var(--m)}nav button.cur{background:var(--g);border-color:var(--c)}nav button.lock{opacity:.45;cursor:not-allowed}nav button.done small{color:var(--ok)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--b)}
#menu{display:none;background:var(--g);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:6px 10px}
.pg{flex:1;height:10px;background:#ffffff14;border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--v));transition:width .6s}
#view{flex:1;padding:22px;max-width:980px;width:100%;margin:0 auto;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
footer{padding:10px;text-align:center;color:var(--m);font-size:12px;border-top:1px solid var(--b)}
h2{margin:0 0 6px;font-size:26px;background:linear-gradient(90deg,var(--c),var(--v));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--g);border:1px solid var(--b);border-radius:16px;padding:16px;backdrop-filter:blur(8px);margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.btn{background:linear-gradient(135deg,var(--c),var(--v));color:#04101f;font-weight:700;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;font-size:15px;margin:6px 6px 6px 0;transition:.2s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px #38e1ff44}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.s{background:var(--g);color:var(--t);border:1px solid var(--b)}
input,textarea{width:100%;background:#050b18;color:var(--t);border:1px solid var(--b);border-radius:10px;padding:10px;font:inherit;margin:4px 0}
pre,.code{background:#050b18;border:1px solid var(--b);border-radius:12px;padding:12px;overflow:auto;font:13px/1.5 ui-monospace,Consolas,monospace;margin:8px 0;white-space:pre}
.con{background:#000;color:var(--ok);min-height:90px;max-height:200px;overflow:auto}
.k{color:#ff9ac1}.cl{color:var(--c)}.at{color:#ffd166}.me{color:var(--ok)}.ob{color:#b6a8ff}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700}.flow span{background:#ffffff12;border:1px solid var(--b);border-radius:20px;padding:4px 12px}
.ok{color:var(--ok);font-weight:700}.er{color:var(--er);font-weight:700}
.obj{border:1px solid var(--c);border-radius:12px;padding:10px;background:#38e1ff0f;font:13px ui-monospace,monospace}
.opt{display:block;width:100%;text-align:left;background:var(--g);border:1px solid var(--b);color:var(--t);border-radius:12px;padding:12px;margin:6px 0;cursor:pointer;font-size:15px}
.opt.r{border-color:var(--ok);background:#3ee08f22}.opt.w{border-color:var(--er);background:#ff6b7a22}
.hero{text-align:center;padding:30px 10px;position:relative;overflow:hidden}.hero .fl{position:absolute;inset:0;pointer-events:none;color:#38e1ff33;font:12px monospace}
.fl span{position:absolute;animation:up 9s linear infinite}@keyframes up{from{transform:translateY(120%)}to{transform:translateY(-300%)}}
.big{font-size:56px;animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#12203d;border:1px solid var(--c);padding:10px 18px;border-radius:12px;display:none;z-index:9}
canvas{width:100%;border-radius:12px;border:1px solid var(--b)}
@media(max-width:800px){nav{position:fixed;z-index:8;left:-260px;transition:.3s}nav.o{left:0}#menu{display:block}#view{padding:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="app"><nav id="nav"></nav><main><header><button id="menu" onclick="nav.classList.toggle('o')">☰</button><b style="white-space:nowrap">PROGRESS <span id="pc">0%</span></b><div class="pg"><i id="pb"></i></div></header>
<div id="view"></div><footer>PBO – Koding dan Kecerdasan Artifisial · Kelas XI Fase F · SMA Negeri 37 Maluku Tengah · Pengembang: Irfan Marahena, S.Pd</footer></main></div>
<div id="toast"></div>
<script>
const P=[['mulai','▶','Mulai'],['kes','🤝','Kesepakatan Kelas'],['tp','🎯','TP & IKTP'],['materi','📚','Materi'],['sim','🧪','Simulasi'],['lkpd','📝','LKPD'],['eval','🎮','Evaluasi'],['sert','🏆','Sertifikat'],['refl','💭','Refleksi'],['end','🔚','Penutup']];
const PCT={mulai:10,kes:20,tp:30,materi:40,sim:50,lkpd:65,eval:80,refl:90,end:100};
const REQ={mulai:null,kes:'mulai',tp:'kes',materi:'tp',sim:'materi',lkpd:'sim',eval:'lkpd',sert:'eval',refl:'eval',end:'refl'};
const NEXT={mulai:'kes',kes:'tp',tp:'materi',materi:'sim',sim:'lkpd',lkpd:'eval',eval:'sert',refl:'end'};
const KEY='oopLabSMAN37';let S={done:{},nama:'',kelas:'',ans:{},score:null,refl:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
let cur='mulai',ms=0,objs=[],qi=0,sc=0,ans=false;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)}
const open=k=>!REQ[k]||S.done[REQ[k]];
function renderNav(){let p=0;for(const k in PCT)if(S.done[k])p=Math.max(p,PCT[k]);$('pc').textContent=p+'%';$('pb').style.width=p+'%';
$('nav').innerHTML='<h1>🧪 VIRTUAL OOP LAB</h1>'+P.map(([k,i,n])=>{const o=open(k),d=S.done[k];return `<button class="${k==cur?'cur ':''}${o?'':'lock '}${d?'done':''}" onclick="go('${k}')"><span>${o?i:'🔒'}</span><span>${n}<small>${!o?'🔒 TERKUNCI':d?'✅ SELESAI':'▶ MULAI / LANJUTKAN'}</small></span></button>`}).join('')}
function go(k){if(!open(k)){toast('🔒 Selesaikan tahap sebelumnya dulu');return}cur=k;$('nav').classList.remove('o');const v=$('view');v.style.animation='none';v.offsetWidth;v.style.animation='';V[k]();renderNav();scrollTo(0,0)}
function done(k){S.done[k]=1;save();toast('✅ Tahap selesai!');if(NEXT[k])go(NEXT[k]);else renderNav()}
const back=()=>{const i=P.findIndex(p=>p[0]==cur);return i>0?`<button class="btn s" onclick="go('${P[i-1][0]}')">◀ Kembali</button>`:''};
const flow=a=>'<div class="flow">'+a.map(x=>`<span>${x}</span>`).join(' → ')+'</div>';
const JC=`class Hero {
    String nama;
    int hp;

    void menyerang() {
        System.out.println(nama + " sedang menyerang lawan!");
    }
}

public class Main {
    public static void main(String[] args) {
        Hero hero1 = new Hero();
        hero1.nama = "Layla";
        hero1.hp = 2000;

        Hero hero2 = new Hero();
        hero2.nama = "Alucard";
        hero2.hp = 3200;

        hero1.menyerang();
        hero2.menyerang();
    }
}`;
function hl(c){return esc(c).replace(/\b(class|public|static|void|new|int|String)\b/g,'<b class=k>$1</b>').replace(/\b(Hero)\b/g,'<b class=cl>$1</b>').replace(/\b(hero1|hero2)\b/g,'<b class=ob>$1</b>').replace(/\b(menyerang)\b/g,'<b class=me>$1</b>').replace(/\b(nama|hp)\b/g,'<b class=at>$1</b>')}
const LKC=`class KarakterGame {
    String nama;
    String tipe;
    int damage;

    void serang() {
        System.out.println(
            nama + " berjenis " + tipe +
            " menyerang dengan kekuatan " + damage + "!"
        );
    }
}

public class Main {
    public static void main(String[] args) {
        KarakterGame player1 = new KarakterGame();
        player1.nama = "Zilong";
        player1.tipe = "Fighter";
        player1.damage = 300;
        System.out.println("=== ARENA PERMAINAN ===");
        player1.serang();
    }
}`;
const MAT=[
['MATERI 1 – APA ITU OOP?',`<p>Object-Oriented Programming (OOP) adalah paradigma pemrograman yang berorientasi pada "objek". Data dan fungsi dibungkus dalam satu entitas, mirip benda di dunia nyata.</p><div class="card"><h3>🚗 Analogi: Mobil</h3><p><b>Data:</b> warna, merek, kecepatan<br><b>Perilaku:</b> berjalan(), berhenti(), mempercepat()</p></div>`],
['MATERI 2 – CLASS VS OBJECT',`<p><b>Class</b> = cetakan/blueprint, belum menjadi benda nyata. <b>Object</b> = produk nyata dari Class. Prosesnya disebut <b>INSTANSIASI</b>.</p>${flow(['CETAKAN','PROSES','PRODUK'])}<div class="grid"><div class="card">🍪 <b>Analogi Kue</b><br>Class: cetakan bintang<br>Object: kue keju, kue cokelat</div><div class="card">⚔ <b>Analogi RPG</b><br>Class: cetakan Hero<br>Object: Miya, Layla, Alucard</div></div>`],
['MATERI 3 – ATTRIBUTE & METHOD',`<p><b>Attribute</b> = data/ciri milik Object. <b>Method</b> = aksi yang dapat dilakukan Object.</p><div class="card"><h3 class="cl">CLASS HERO</h3><b class="at">Attributes:</b> nama, hp, attackPower<br><b class="me">Methods:</b> berjalan(), menyerang(), gunakanSkill()</div>`],
['MATERI 4 – IMPLEMENTASI JAVA',`<p>Perhatikan warna: <b class=k>kata kunci</b>, <b class=cl>Class</b>, <b class=at>attribute</b>, <b class=ob>object</b>, <b class=me>method</b>. Baris <code>new Hero()</code> adalah instansiasi.</p><pre>${hl(JC)}</pre><button class="btn" onclick="runJ()">▶ JALANKAN KODE</button><pre class="con" id="jc">&gt; Tekan tombol untuk menjalankan…</pre>`]];
function runJ(){$('jc').textContent='> Layla sedang menyerang lawan!\n> Alucard sedang menyerang lawan!'}
const Q=[['Dalam OOP, Class dapat dianalogikan sebagai...',['Produk jadi','Cetakan/rancangan','Hasil program','Tampilan aplikasi'],1,'Class adalah cetakan/blueprint.'],
['Object adalah...',['Cetakan program','Komentar program','Hasil instansiasi dari Class','Error program'],2,'Object dibuat dari Class lewat instansiasi.'],
['Manakah yang termasuk Attribute?',['menyerang()','berjalan()','nama','gunakanSkill()'],2,'Attribute adalah data/ciri, seperti nama.'],
['Manakah yang termasuk Method?',['hp','nama','attackPower','menyerang()'],3,'Method adalah aksi dan ditulis dengan tanda kurung.'],
['Perintah Hero hero1 = new Hero(); digunakan untuk...',['Menghapus Class','Membuat Object dari Class Hero','Menghapus Object','Membuat komentar'],1,'new Hero() membuat object baru dari Class Hero.']];
const V={
mulai(){$('view').innerHTML=`<div class="hero card"><div class="fl">${Array.from({length:14},(_,i)=>`<span style="left:${i*7}%;animation-delay:${-i*.7}s">class Hero{ }</span>`).join('')}</div><div class="big">🤖💻</div><h2>PEMROGRAMAN BERORIENTASI OBJEK (OOP)</h2><p><b>Koding dan Kecerdasan Artifisial</b><br>Kelas XI Fase F · SMA Negeri 37 Maluku Tengah<br>Pengembang: Irfan Marahena, S.Pd</p><pre style="text-align:left;display:inline-block" class="con">$ new Hero("Kamu");\n> Selamat datang di Virtual OOP Lab_</pre><div style="max-width:380px;margin:auto"><input id="nm" placeholder="Nama siswa" value="${esc(S.nama)}"><input id="kl" placeholder="Kelas (mis. XI-A)" value="${esc(S.kelas)}"><button class="btn" onclick="start()">▶ MULAI PEMBELAJARAN</button><button class="btn s" onclick="resetAll()">Reset pembelajaran</button></div></div>`},
kes(){const L=[['HADIR TEPAT WAKTU','Hadir tepat waktu dan siap mengikuti pembelajaran.'],['SALING MENGHARGAI','Saling menghargai, menghormati dan mendengarkan ketika ada guru atau teman yang berbicara.'],['BERTANGGUNG JAWAB','Bertanggung jawab pada tugas.'],['BIJAK MENGGUNAKAN HP','Bijak dalam menggunakan HP.'],['MENJAGA KELAS','Menjaga kebersihan dan keamanan kelas.'],['KOMPAK DAN SALING DUKUNG','Kompak dan saling mendukung.']];
$('view').innerHTML=`<h2>KESEPAKATAN KELAS</h2><div class="grid">${L.map((x,i)=>`<div class="card"><b>${i+1}. ${x[0]}</b><br>${x[1]}</div>`).join('')}</div><label><input type="checkbox" id="ck" style="width:auto" onchange="$('bk').disabled=!this.checked"> Saya membaca dan menyetujui kesepakatan kelas.</label><br>${back()}<button class="btn" id="bk" disabled onclick="done('kes')">SAYA SETUJU & LANJUTKAN</button>`},
tp(){$('view').innerHTML=`<h2>TUJUAN PEMBELAJARAN & IKTP</h2><div class="card"><b>TP</b><br>11.3 Memahami konsep OOP dan siklus pengembangan software (engineering process).</div><div class="card"><b>IKTP</b><br>11.3.1 Murid mampu menjelaskan konsep OOP serta tahapan siklus pengembangan software, dan mampu membuat class dan objek sederhana dalam kode program.</div>${flow(['Class','Object','Method','Program'])}<br>${back()}<button class="btn" onclick="done('tp')">✓ SAYA MEMAHAMI TUJUAN PEMBELAJARAN</button>`},
materi(){const m=MAT[ms];$('view').innerHTML=`<h2>${m[0]}</h2><small>Slide ${ms+1}/${MAT.length}</small><div class="card">${m[1]}</div><button class="btn s" ${ms?'':'disabled'} onclick="ms--;V.materi()">◀ Sebelumnya</button>${ms<MAT.length-1?`<button class="btn" onclick="ms++;V.materi()">Berikutnya ▶</button>`:`<button class="btn" onclick="done('materi')">✓ SELESAI MATERI</button>`}`},
sim(){$('view').innerHTML=`<h2>VIRTUAL LAB – CLASS & OBJECT</h2>${flow(['CLASS','OBJECT','ATTRIBUTE','METHOD','OUTPUT'])}<div class="grid"><div class="card"><b>CLASS EDITOR</b><pre>class Hero:\n    def __init__(self, nama, hp):\n        self.nama = nama\n        self.hp = hp\n\n    def menyerang(self):\n        print(self.nama, "sedang menyerang!")</pre><button class="btn s" onclick="log('Class Hero siap digunakan.')">RUN CODE</button></div><div class="card"><b>OBJECT CREATOR</b><input id="hn" placeholder="Nama Hero"><input id="hh" type="number" placeholder="HP"><button class="btn" onclick="mk()">+ BUAT OBJECT</button><button class="btn s" onclick="objs=[];V.sim()">RESET SIMULASI</button></div></div><div class="card"><b>CLASS HERO</b> ↓ INSTANSIASI ↓<div class="grid" id="ol">${objs.map((o,i)=>`<div class="obj">┌ OBJECT: HERO ${i+1}<br>│ Nama: ${esc(o.n)}<br>│ HP: ${o.h}<br>│ Status: ACTIVE<br>└<br><button class="btn" onclick="at(${i})">⚔ SERANG</button></div>`).join('')||'<small>Belum ada object.</small>'}</div></div><pre class="con" id="sc">${esc(CL.join('\n'))||'> Console siap_'}</pre>${objs.length?'<div class="ok">✅ SIMULASI BERHASIL</div>':''}${back()}<button class="btn" ${objs.length?'':'disabled'} onclick="done('sim')">Lanjut ke LKPD ▶</button>`},
lkpd(){const a=S.ans;$('view').innerHTML=`<h2>LKPD PRAKTIKUM PBO</h2><small>Implementasi Class & Object (Analogi Game) lewat Smartphone · Fase F / Kelas XI</small><div class="card"><b>Nama:</b> ${esc(S.nama)} · <b>Kelas:</b> ${esc(S.kelas)}<br><b>A. Tujuan:</b> menuliskan struktur Class, instansiasi Object, dan menjalankan kode OOP di smartphone.<br><b>B. Alat:</b> smartphone, internet, browser, kompiler online (OnlineGDB / Replit).</div><div class="card"><b>Langkah 1.</b> Buka browser, masuk onlinegdb.com, pilih bahasa Java, hapus kode bawaan.<br><b>Langkah 2.</b> Ketik kode berikut:<pre id="lk">${esc(LKC)}</pre><button class="btn s" onclick="cp()">SALIN KODE</button><br><b>Langkah 3.</b> Klik Run, tunggu compiling, amati Console. Tuliskan hasilnya:<textarea id="a3" rows="3">${esc(a.a3||'')}</textarea><button class="btn" onclick="sv('a3')">SIMPAN JAWABAN</button></div><div class="card"><b>D. Tantangan Mandiri</b><br>1) Tambahkan Object kedua bernama <code>player2</code> (karakter favoritmu). 2) Panggil <code>player2.serang();</code><textarea id="ch" rows="5" placeholder="Tulis kode player2 di sini...">${esc(a.ch||'')}</textarea><button class="btn" onclick="chk()">▶ CEK KODE</button><div id="fb">${a.ok?'<span class=ok>✅ Mantap! Object kedua berhasil dibuat.</span>':''}</div></div><div class="card"><b>E. Pertanyaan Evaluasi</b><br>1. Bagian mana yang bertindak sebagai "Cetakan/Rancangan Utamanya"?<input id="q1" value="${esc(a.q1||'')}">2. Sebutkan nama "Object Nyata" yang kamu hidupkan di memori program!<input id="q2" value="${esc(a.q2||'')}"></div>${back()}<button class="btn" onclick="fin()">✓ SELESAI LKPD</button>`},
eval(){if(S.done.eval)return V.res();if(!S.qz){$('view').innerHTML=`<h2>EVALUASI PEMBELAJARAN</h2><div class="card">⚠ Evaluasi terdiri dari 5 soal dan <b>hanya dapat dikerjakan 1 kali</b>. Jawaban tidak dapat diulang atau diubah. Pastikan kamu sudah siap.</div>${back()}<button class="btn" onclick="S.qz={i:0,s:0};save();V.eval()">▶ MULAI EVALUASI</button>`;return}qi=S.qz.i;sc=S.qz.s;ans=false;V.q()},
q(){if(qi>=5)return V.res();const q=Q[qi];ans=false;$('view').innerHTML=`<h2>EVALUASI PEMBELAJARAN</h2><small>Soal ${qi+1}/5 · Evaluasi hanya 1 kali pengerjaan</small><div class="card"><b>${esc(q[0])}</b>${q[1].map((o,i)=>`<button class="opt" onclick="pk(${i},this)">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}<div id="qf"></div></div>`},
res(){const n=sc*20,k=n>=90?'Sangat Baik':n>=80?'Baik':n>=70?'Cukup':'Perlu Belajar Lagi';S.score=n;S.done.eval=1;save();renderNav();$('view').innerHTML=`<h2>HASIL EVALUASI</h2><div class="card" style="text-align:center"><div class="big">${n>=70?'🏆':'📚'}</div><p>Nama: <b>${esc(S.nama)}</b> · Kelas: <b>${esc(S.kelas)}</b></p><h1 style="font-size:54px;margin:0">${n}/100</h1><p>Kategori: <b>${k}</b></p><p><small>Evaluasi hanya dapat dikerjakan 1 kali.</small></p><p class="${n>=70?'ok':'er'}">${n>=70?'✅ PEMBELAJARAN BERHASIL':'📚 AYO PELAJARI KEMBALI MATERINYA'}</p></div><button class="btn s" onclick="go('materi')">Ulangi Materi</button><button class="btn" onclick="go('sert')">Lihat Sertifikat 🏆</button>`},
sert(){$('view').innerHTML=`<h2>SERTIFIKAT DIGITAL</h2><canvas id="cv" width="1200" height="800"></canvas><br><button class="btn" onclick="dl()">⬇ UNDUH SERTIFIKAT</button><button class="btn s" onclick="go('refl')">Lanjut ke Refleksi ▶</button>`;draw()},
refl(){const r=S.refl,T=['Apa hal baru yang kamu pahami tentang Class dan Object?','Bagian mana dari pembelajaran OOP yang paling menarik?','Bagian mana yang masih terasa sulit?','Aplikasi atau game sederhana apa yang ingin kamu buat?','Bagaimana pengalamanmu menggunakan Virtual Lab?'];$('view').innerHTML=`<h2>REFLEKSI PEMBELAJARAN</h2>${T.map((t,i)=>`<div class="card"><b>${i+1}. ${t}</b><textarea id="r${i}" rows="2">${esc(r['r'+i]||'')}</textarea></div>`).join('')}<div class="card"><b>Skala pengalaman</b><br>${['😄 Sangat Menyenangkan','🙂 Menyenangkan','😐 Cukup','😕 Masih Membingungkan'].map(m=>`<label style="display:block"><input type="radio" name="mo" style="width:auto" value="${m}" ${r.mo==m?'checked':''}> ${m}</label>`).join('')}</div><button class="btn" onclick="rf()">SIMPAN REFLEKSI</button>${S.done.refl?EM():''}`},
end(){$('view').innerHTML=`<div class="hero card"><div class="big">🎓</div><h2>SELAMAT!</h2><p>Kamu telah menyelesaikan <b>PEMROGRAMAN BERORIENTASI OBJEK (OOP)</b></p>${flow(['Class','Object','Program','Developer'])}<p><i>"Terima Kasih semoga dapat diimplementasikan untuk pembelajaran berikutnya ya…!"</i></p><p><b>Koding dan Kecerdasan Artifisial</b><br>SMA Negeri 37 Maluku Tengah<br>Irfan Marahena, S.Pd</p><button class="btn" onclick="resetAll(1)">↻ ULANGI PEMBELAJARAN</button><button class="btn s" onclick="go('mulai')">🏠 KEMBALI KE BERANDA</button></div>`}};
let CL=[];
function log(m){CL.push('> '+m);const c=$('sc');if(c){c.textContent=CL.join('\n');c.scrollTop=9e9}}
function mk(){const n=$('hn').value.trim(),h=parseInt($('hh').value);if(!n||isNaN(h)||h<=0){toast('⚠ Isi nama dan HP (angka) dulu');return}objs.push({n,h});CL.push('> Object Hero berhasil dibuat: '+n+' (HP '+h+')');V.sim()}
function at(i){CL.push('> '+objs[i].n+' sedang menyerang!');V.sim()}
function start(){const n=$('nm').value.trim(),k=$('kl').value.trim();if(!n||!k){toast('⚠ Isi nama dan kelas dulu');return}S.nama=n;S.kelas=k;save();done('mulai')}
function cp(){const t=LKC;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Kode disalin'),()=>{const r=document.createRange();r.selectNodeContents($('lk'));getSelection().removeAllRanges();getSelection().addRange(r);toast('Kode dipilih, tekan Salin')})}
function sv(id){const v=$(id).value.trim();if(!v){toast('⚠ Isi jawaban dulu');return}S.ans[id]=v;save();toast('Jawaban tersimpan')}
function chk(){const c=$('ch').value;S.ans.ch=c;const ok=/KarakterGame\s+player2\s*=\s*new\s+KarakterGame\s*\(\s*\)\s*;/.test(c)&&/player2\s*\.\s*serang\s*\(\s*\)\s*;/.test(c);S.ans.ok=ok;save();$('fb').innerHTML=ok?'<span class=ok>✅ Mantap! Object kedua berhasil dibuat.</span>':'<span class=er>⚠ Periksa kembali nama Class, Object, Attribute, dan Method.</span>'}
function fin(){S.ans.q1=$('q1').value.trim();S.ans.q2=$('q2').value.trim();save();if(!S.ans.a3||!S.ans.ok||!S.ans.q1||!S.ans.q2){toast('⚠ Lengkapi jawaban, tantangan (benar), dan 2 pertanyaan');return}done('lkpd')}
